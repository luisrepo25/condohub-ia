[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "condohub-ia"
version = "0.1.0"
description = "Servicio IA de CondoHub: visión (rostros, placas) y voz (reportes)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",            # cliente de Gestión y del LLM (G4)
    "graphql-core>=3.2",      # analiza las consultas del LLM: solo lectura (G4)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyyaml>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.20",
    "openpyxl>=3.1",
    "reportlab>=4",
]

# Modelo facial real del servicio (MODELO_FACIAL=facenet). `facenet-pytorch` se instala aparte con
# `pip install facenet-pytorch --no-deps`: fija versiones antiguas de torch que chocan con las actuales.
inferencia = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10",
]

# Persistencia en MongoDB (PERSISTENCIA=mongo), con el driver síncrono: los casos de uso del servicio son síncronos.
persistencia = [
    "pymongo>=4.7",
]

# Job nocturno de I4: agrupamiento (DBSCAN) y publicación de avisos en RabbitMQ
agrupamiento = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pika>=1.3",
]

# G4: reportes por voz (Whisper local, GraphQL, Excel y PDF). El LLM es la API de Gemini: sin dependencia, va por httpx.
voz = [
    "faster-whisper>=1.0",
]
reportes = [
    "openpyxl>=3.1",
    "reportlab>=4",
]

ml = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyyaml>=6",
    "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "ml/tests"]
pythonpath = ["."]
markers = ["integracion: requiere un MongoDB real (se omite sola si no está disponible)"]

[tool.ruff]
line-length = 110
extend-exclude = ["ml/notebooks"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"ml/**" = ["E501"]   # código de experimentación: docstrings largos permitidos

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "reportlab.*", "faster_whisper.*"]
ignore_missing_imports = true
